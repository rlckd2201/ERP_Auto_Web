<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>엑셀 전표 처리</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="stylesheet" href="/static/logs.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>엑셀 전표 처리</h1>
      </div>
      <div class="topActions">
        <div id="userBar" class="userBar" hidden>
          <span id="userName"></span>
          <button class="textButton" id="logoutButton" type="button">로그아웃</button>
        </div>
        <button class="iconButton" id="refreshButton" type="button" title="새로고침" aria-label="새로고침">↻</button>
      </div>
    </header>

    <nav class="workspaceTabs" id="workspaceTabs" role="tablist" aria-label="업무 화면" hidden>
      <button id="workTab" role="tab" aria-selected="true" aria-controls="appShell" type="button">전표 처리</button>
      <button id="logsTab" role="tab" aria-selected="false" aria-controls="logsShell" tabindex="-1" type="button">로그 조회</button>
    </nav>

    <main id="authShell" class="authShell" hidden>
      <section class="panel authPanel" id="loginPanel">
        <div class="panelTitle">
          <h2>로그인</h2>
        </div>
        <form id="loginForm" class="authForm">
          <label>
            ID
            <input id="loginId" name="user_id" autocomplete="username" required />
          </label>
          <label>
            비밀번호
            <input id="loginPassword" name="password" type="password" autocomplete="current-password" required />
          </label>
          <button class="primaryButton" type="submit">로그인</button>
          <button class="linkButton" id="forgotPasswordButton" type="button">비밀번호 찾기</button>
        </form>
        <div class="notice" id="loginNotice"></div>
      </section>

      <section class="panel authPanel" id="changePasswordPanel" hidden>
        <div class="panelTitle">
          <h2>비밀번호 변경</h2>
        </div>
        <form id="changePasswordForm" class="authForm">
          <label>
            현재 비밀번호
            <input id="oldPassword" name="old_password" type="password" autocomplete="current-password" required />
          </label>
          <label>
            새 비밀번호
            <input id="newPassword" name="new_password" type="password" autocomplete="new-password" minlength="8" required />
          </label>
          <button class="primaryButton" type="submit">변경</button>
        </form>
        <div class="notice" id="changePasswordNotice"></div>
      </section>
    </main>

    <main id="appShell" class="shell" hidden>
      <section class="panel uploadPanel">
        <div class="panelTitle">
          <h2>엑셀 업로드</h2>
          <span class="badge">수시결제</span>
        </div>
        <form id="uploadForm" class="formGrid">
          <label class="compactField">
            담당자
            <select id="companyKey" name="company_key"></select>
          </label>
          <label class="compactField">
            작성자
            <input id="requester" name="requester" autocomplete="name" value="담당자" />
          </label>
          <label class="compactField">
            회계일
            <input id="accountingDate" name="accounting_date" type="date" />
          </label>
          <div class="fileField">
            <label for="fileInput">엑셀 파일</label>
            <input id="fileInput" name="file" type="file" accept=".xlsx,.xlsm" required hidden />
            <button class="dropZone" id="dropZone" type="button">
              <strong id="fileName">선택된 파일 없음</strong>
              <span>파일을 이곳에 끌어오거나 클릭해서 선택</span>
            </button>
          </div>
          <button class="primaryButton" id="uploadButton" type="submit">업로드 시작</button>
        </form>
        <div class="notice" id="uploadNotice"></div>
      </section>

      <section class="panel detailPanel">
        <div class="panelTitle">
          <h2>처리 현황</h2>
          <span id="detailStatus" class="badge muted">대기</span>
        </div>
        <div id="jobDetail" class="currentJob emptyState">엑셀 파일을 업로드하면 처리 현황이 표시됩니다.</div>
      </section>

      <section class="panel adminToolsPanel" id="adminToolsPanel" hidden>
        <div class="panelTitle">
          <h2>전산 운영</h2>
          <span id="adminCommandCount" class="badge muted">0건</span>
        </div>
        <div class="adminActionGrid">
          <button class="dangerButton" id="adminResetJobsButton" type="button">작업 큐 비우기</button>
          <button class="toolButton" id="adminTailLogButton" type="button">Agent 로그 가져오기</button>
          <button class="toolButton" id="adminUpdateServerButton" type="button">서버 최신 적용</button>
          <button class="toolButton" id="adminUpdateAgentButton" type="button">243 최신 적용</button>
          <button class="toolButton" id="adminRestartAgentButton" type="button">Agent 재시작</button>
        </div>
        <div class="notice" id="adminToolNotice"></div>
        <div id="adminCommandRows" class="adminCommandRows"></div>
      </section>

      <section class="panel historyPanel">
        <div class="panelTitle">
          <h2>최근 처리 내역</h2>
          <span id="queueCount" class="badge muted">0건</span>
        </div>
        <div class="tableWrap">
          <table>
            <thead>
              <tr>
                <th>상태</th>
                <th>내용</th>
                <th>회계일</th>
                <th>진행</th>
              </tr>
            </thead>
            <tbody id="jobRows"></tbody>
          </table>
        </div>
      </section>
    </main>

    <main id="logsShell" class="logsShell" role="tabpanel" aria-labelledby="logsTab" hidden>
      <div class="logsHeading">
        <h2>로그 조회</h2>
        <div class="logsActions">
          <label class="logsAuto"><input id="logsAuto" type="checkbox" /> 자동 갱신</label>
          <button class="iconButton" id="logsRefresh" type="button" title="로그 새로고침" aria-label="로그 새로고침"><img src="/static/icons/refresh-cw.svg" width="18" height="18" alt="" /></button>
          <button class="iconButton" id="logsDownload" type="button" title="현재 페이지 다운로드" aria-label="현재 페이지 다운로드" disabled><img src="/static/icons/download.svg" width="18" height="18" alt="" /></button>
        </div>
      </div>
      <div class="logsSource" role="group" aria-label="로그 종류">
        <button type="button" data-log-source="jobs" aria-pressed="true">작업 처리</button>
        <button type="button" data-log-source="agent" aria-pressed="false">Agent</button>
        <button type="button" data-log-source="server" aria-pressed="false">서버</button>
      </div>
      <form id="logsFilters" class="logsFilters">
        <label id="logsJobField">작업<select id="logsJob"><option value="">전체 작업</option></select></label>
        <label id="logsFileField" hidden>로그 파일<select id="logsFile"><option value="">최신 로그</option></select></label>
        <label id="logsStartField">시작일<input id="logsStart" type="date" /></label>
        <label id="logsEndField">종료일<input id="logsEnd" type="date" /></label>
        <label>수준<select id="logsLevel"><option value="all">전체</option><option value="error">오류</option><option value="warning">경고</option><option value="info">일반</option></select></label>
        <label class="logsSearch">검색<input id="logsQuery" type="search" placeholder="내용 또는 작업명" maxlength="200" /></label>
        <button class="iconButton" type="submit" title="로그 검색" aria-label="로그 검색"><img src="/static/icons/search.svg" width="18" height="18" alt="" /></button>
      </form>
      <div class="logsStatusBar">
        <span id="logsSummary" role="status" aria-live="polite">조회 대기</span>
        <button id="logsCollect" class="toolButton" type="button" hidden><img src="/static/icons/refresh-cw.svg" width="16" height="16" alt="" /> Agent 로그 수집</button>
      </div>
      <div id="logsNotice" class="notice" role="status" aria-live="polite"></div>
      <div class="logsTableWrap" id="logsResult" aria-busy="false">
        <table class="logsTable">
          <thead><tr><th>시간</th><th>수준</th><th>작업 / 파일</th><th>메시지</th></tr></thead>
          <tbody id="logsRows"><tr><td colspan="4" class="tableEmpty">조회할 로그를 선택해 주세요.</td></tr></tbody>
        </table>
      </div>
      <div class="logsPager">
        <label>표시 건수<select id="logsPageSize"><option value="50">50</option><option value="100" selected>100</option><option value="200">200</option></select></label>
        <div><button class="iconButton" id="logsPrevious" type="button" title="이전 페이지" aria-label="이전 페이지" disabled><img src="/static/icons/chevron-left.svg" width="18" height="18" alt="" /></button><span id="logsPage">1 / 1</span><button class="iconButton" id="logsNext" type="button" title="다음 페이지" aria-label="다음 페이지" disabled><img src="/static/icons/chevron-right.svg" width="18" height="18" alt="" /></button></div>
      </div>
    </main>

    <div class="modalBackdrop" id="erpCredentialDialog" hidden>
      <form class="modalPanel" id="erpCredentialForm">
        <div class="panelTitle">
          <h2>ERP 로그인 계정</h2>
          <span class="badge">K-System</span>
        </div>
        <p class="modalMessage" id="erpCredentialMessage"></p>
        <label>
          ERP ID
          <input id="erpUserId" name="erp_user_id" autocomplete="username" />
        </label>
        <label>
          ERP 비밀번호
          <input id="erpPassword" name="erp_password" type="password" autocomplete="current-password" />
        </label>
        <label class="checkRow">
          <input id="rememberErpCredential" type="checkbox" checked />
          이 계정을 다음 업로드에도 사용
        </label>
        <div class="modalActions">
          <button id="useSavedErpCredential" type="button">저장된 계정 사용</button>
          <button id="cancelErpCredential" type="button">취소</button>
          <button class="primaryButton" type="submit">입력한 계정으로 시작</button>
        </div>
      </form>
    </div>

    <div class="modalBackdrop" id="erpVerificationDialog" role="dialog" aria-modal="true" aria-labelledby="erpVerificationTitle" hidden>
      <form class="modalPanel" id="erpVerificationForm">
        <div class="panelTitle">
          <h2 id="erpVerificationTitle">ERP 로그인 인증</h2>
          <span class="badge">K-System</span>
        </div>
        <p class="modalMessage">ERP 계정 이메일로 받은 인증번호를 입력해 주세요.</p>
        <label>
          이메일 인증번호
          <input id="verificationCodeInput" inputmode="numeric" maxlength="32" autocomplete="one-time-code" required />
        </label>
        <div class="modalActions">
          <button class="primaryButton" id="verificationCodeButton" type="submit">인증번호 전송</button>
        </div>
      </form>
    </div>

    <script src="/static/app.js"></script>
    <script src="/static/logs.js"></script>
  </body>
</html>
