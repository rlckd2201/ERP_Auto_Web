<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DB 보기로 이동</title>
  <script>
    const destination = new URL(window.location.href);
    destination.pathname = destination.pathname.replace(/\/(?:assets\/)?admin_db\.html$|\/admin-db\/?$/, "/");
    destination.search = "";
    destination.hash = "db";
    window.location.replace(destination.href);
  </script>
</head>
<body><p>업무 화면의 DB 보기 탭으로 이동합니다.</p><a href="./#db">업무 화면 열기</a></body>
</html>
